[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragstone-mcp-plugins"
version = "0.1.0"
description = "Office IDE MCP plugin scaffolding (stdlib HTTP stubs; no Graph)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_plugins*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
