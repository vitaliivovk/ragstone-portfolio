[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragstone-conversation-mining"
version = "0.1.0"
description = "Office IDE conversation mining scaffolding (offline RAG_TURN_AUDIT → process sketches)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["conversation_mining*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
