[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragstone-process-engine"
version = "0.1.0"
description = "Office IDE process/workflow engine v1 scaffolding (definitions + dry-run runner)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
process-engine-dry-run = "process_engine.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["process_engine*"]

[tool.setuptools.package-data]
process_engine = ["catalog/**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
