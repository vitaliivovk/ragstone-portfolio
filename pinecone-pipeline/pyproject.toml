[project]
name = "ragstone-pinecone-pipeline"
version = "0.1.0"
description = "Document processing pipeline for RAGStone - parses, chunks, and indexes documents into Pinecone"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Document parsing
    "unstructured>=0.18.13",
    "unstructured-pytesseract>=0.3.13",
    "python-pptx>=0.6.21",
    "python-docx>=1.1.2",
    "openpyxl>=3.1.5",
    "pandas>=2.3.0",
    
    # PDF processing (pdfminer.six for unstructured; avoid legacy `pdfminer` package)
    "pdf2image>=1.17.0",
    "pdfminer.six>=20231228",
    "pypdf>=5.7.0",
    "pi-heif>=0.22.0",
    
    # Vector database and embeddings
    "openai>=1.2.2",
    "pinecone>=5.0.0",
    
    # Utilities
    "tiktoken>=0.9.0",
    "python-dotenv>=1.0.1",
    "bs4>=0.0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
ragstone-index = "cli:main"

[tool.hatch.build.targets.wheel]
only-include = [
    "cli.py",
    "pinecone_io.py",
    "corpus_metadata.py",
    "summary_spans.py",
    "retrieval_helper.py",
    "document_parser",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
